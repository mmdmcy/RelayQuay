# Copy this into your private Plugroot local config and adjust locally.
# Do not put real domains, paths, or tunnel tokens in this public checkout.
#
# Keep RelayQuay as a standalone checkout. Plugroot's Compose adapter cannot
# select RelayQuay's active/cover and gateway overlays, so bin/relayquay remains
# the lifecycle authority.
#
# Use an absolute repo path until Plugroot resolves managed checkout paths
# independently of its process working directory.
#
# Invoke bin/relayquay with:
#   RELAYQUAY_ENV_FILE=<private-state-root>/relayquay/relayquay.env
# In that private file, use host-specific values, including:
#   RELAYQUAY_STATE_DIR=<private-state-root>/relayquay
#   RELAYQUAY_GATEWAY=rustopviewer
#   RELAYQUAY_APP_UPSTREAM=127.0.0.1:45080

[[repo]]
id = "relayquay"
url = "https://github.com/mmdmcy/RelayQuay.git"
path = "<absolute-path-to-relayquay-checkout>"
ref = "main"

[[service]]
id = "relayquay"
name = "RelayQuay RustOpViewer Gateway"
plane = "public-authenticated"
category = "remote-access"
kind = "manual"
host = "127.0.0.1"
port = 8788
repo = "relayquay"
url = "https://rov.example.com/healthz"
access = "Cloudflare Access allowlist"
description = "Access-protected gateway monitored by Plugroot and operated with bin/relayquay."
controls = []
ports = [
  "8788/tcp loopback Caddy gateway",
  "45080/tcp loopback RustOpViewer upstream",
]
optional = true
